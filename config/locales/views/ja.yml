      headline: 学習時間だけでは見えない努力を、記録に残す。
      caption: 着手・集中・チャレンジの3つで、その日の学習を振り返る。
      body: |-
        疲れていても始められた日も、集中が切れた日も。
        時間の長さには写らない努力を記録します。
      study:
        title_html: "%{minutes}分から、始められる。"
        body: 時間を選んで、学習する内容を書いて、始めるだけ。
      evaluation:
        title: 終わったら、選ぶだけ。
        body: 学習に取り組んだかは自動で記録。集中とチャレンジを、実感に近いものから1つずつ選ぶだけ。その日の学習への姿勢をRankに変換
        note_html: Rankは成績ではありません。今日の努力を%{axes}つの軸で要約した印です。
      history:
        title: 続けた分だけ、記録に残る。
        body: いつ、どれくらい、どんな状態で取り組めたか。何度でも見返せます。
      principles:
        title: きづきが、しないこと。
        items:
          - 他人と比べること、ランキング
          - 連続日数の強制。途切れても、戻ってくればいい
          - Rank Cを「失敗」と呼ぶこと
      origin:
        title: なぜ「きづき」か。
        body: 学習の記録が積み重なると、自分がどんなときに学べるのかが見えてきます。
        vision: 気づくたびに、築かれていく——それが名前の由来であり、このサービスが目指している「じぶんの取扱説明書」です。
      final_cta:
        title_html: "最初の%{minutes}分から、<br>始めてみませんか。"
      cta_primary: 無料で始める
      cta_login: ログイン
      footer_signature: きづき KIZUKI
    terms:
      title: 利用規約
      updated_at: "最終更新日: 2026年11月3日"
      intro: この利用規約（以下「本規約」）は、学習の記録と振り返りのサービス「きづき」（以下「本サービス」）の利用条件を定めるものです。本サービスを利用する方は、本規約に同意したものとみなします。
      sections:
        - heading: 第1条 利用登録
          items:
            - 本サービスの利用には、アカウント名・メールアドレス・パスワードの登録が必要です。
            - 登録する情報は、正確なものを入力してください。
            - パスワードは、ご自身の責任で管理してください。第三者に使わせたり、貸したりしないでください。
            - 次の場合は、運営者が登録をお断りすることがあります。登録した情報に誤りや虚偽があるとき、過去に本規約に違反したことがあるとき、そのほか運営者が登録を適当でないと判断したとき。
        - heading: 第2条 禁止事項
          body:
            - 次の行為をしないでください。
          items:
            - 法令または公序良俗に反する行為
            - 他の人のアカウントを使う、または使おうとする行為
            - 本サービスやサーバーに、不正にアクセスする行為、負荷をかける行為
            - 本サービスの運営を妨げる行為
            - 他の人の個人情報を、その人の同意なく入力する行為
            - そのほか、運営者が不適切と判断する行為
        - heading: 第3条 サービスの変更・停止
          items:
            - 運営者は、事前に知らせることなく、本サービスの内容を変更したり、提供を一時的に止めたり、終了したりすることがあります。
            - 禁止事項に当たる行為があったときは、運営者は、その人の利用をお断りすることがあります。
        - heading: 第4条 免責
          items:
            - 本サービスの自己評価（集中・チャレンジなど）や記録は、ご自身の振り返りのための目安です。学習の成果や効果を保証するものではありません。
            - 本サービスは、現状のまま提供します。内容の正確さ・安全さ・継続して使えることを、運営者は保証しません。
            - 本サービスの利用や、停止・変更・終了によって生じた損害について、運営者は、故意または重大な過失がある場合を除いて、責任を負いません。
        - heading: 第5条 規約の変更
          items:
            - 運営者は、必要に応じて本規約を変更することがあります。
            - 変更した規約は、このページに掲載した時点から効力を持ちます。変更後も本サービスを使い続けた場合は、変更後の規約に同意したものとみなします。
        - heading: 第6条 個人情報の取扱い
          body:
            - 本サービスで預かる個人情報は、別に定める「プライバシーポリシー」にしたがって取り扱います。
    privacy:
      title: プライバシーポリシー
      updated_at: "最終更新日: 2026年11月3日"
      intro: 「きづき」（以下「本サービス」）は、利用者から預かる情報を、このプライバシーポリシーにしたがって取り扱います。
      sections:
        - heading: 1. 集める情報
          body:
            - 利用者が入力した、または本サービスの利用にともなって記録される、次の情報を保存します。
          items:
            - アカウントの情報：メールアドレス、アカウント名、パスワード（暗号化して保存します。運営者が元のパスワードを見ることはできません）
            - 目標と学習スキル：設定した目標、選んだ学習スキル
            - 学習の記録：学習の開始・終了の時刻、学習した時間、今回やること
            - 自己評価：集中・チャレンジの自己評価
            - 週の振り返り：期待、期待の補足、実感、ひと言
        - heading: 2. 使う目的
          body:
            - 集めた情報は、次の目的に使います。
          items:
            - 学習の記録と振り返りを、利用者本人に表示するため
            - 本サービスを改善するため
        - heading: 3. 保存先
          body:
            - 集めた情報は、国内外のクラウドサービスに保存します。
        - heading: 4. 第三者への提供
          body:
            - 集めた情報は、法令による場合を除いて、利用者の同意なく第三者に提供しません。
        - heading: 5. 方針の変更
          body:
            - このプライバシーポリシーは、必要に応じて変更することがあります。変更したときは、このページに掲載し、「最終更新日」を改めます。
